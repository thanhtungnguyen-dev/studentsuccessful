name: Engineering Foundation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  contract-sync:
    name: OpenAPI Contract Synchronization Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Backend Dependencies
        run: pip install -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Regenerate OpenAPI & TypeScript Contract
        run: python scripts/generate_api_client.py --check

      - name: Verify Contract Is Up-to-Date (No Stale Generation)
        run: git diff --exit-code backend/openapi.json frontend/lib/api/schema.d.ts

  backend-checks:
    name: Backend Lint, Test & Migration Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studentsuccessful_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studentsuccessful_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/studentsuccessful_test_ci
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/studentsuccessful_test_ci
      ALLOW_DISPOSABLE_TEST_DATABASE: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: ruff check backend

      - name: Validate Alembic Migrations
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini current --check-heads
          alembic -c backend/alembic.ini check

      - name: Verify PostgreSQL Invariants and Fresh Migration
        run: python -m pytest backend/tests/test_migrations.py backend/tests/test_postgresql_schema.py

      - name: Run Pytest Suite (Config, UoW, Isolation, Fresh DB)
        run: PYTHONPATH=. pytest backend/tests

  frontend-checks:
    name: Frontend Lint, Type-Check, Test & Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: TypeScript Type-Check
        run: cd frontend && npm run type-check

      - name: Run Vitest Unit Tests
        run: cd frontend && npm run test

      - name: Next.js Production Build
        run: cd frontend && npm run build

  compose-smoke:
    name: Fresh Compose Smoke and Browser Auth
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ss-r5-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate production deployment definition
        run: docker compose --env-file deploy/production.env.example -f docker-compose.production.yml config --quiet
      - name: Build both images
        run: docker compose build
      - name: Start PostgreSQL, migrate, and wait for application health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify migration exit and HTTP routes with browser Origin
        run: |
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")" = "0"
          docker compose run --rm -T migrate python -m alembic -c backend/alembic.ini current --check-heads
          docker compose run --rm -T migrate python -m alembic -c backend/alembic.ini check
          python scripts/smoke_compose.py
      - name: Real browser authentication lifecycle
        working-directory: frontend
        env:
          ALLOW_DISPOSABLE_E2E: "1"
          E2E_COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
        run: npm run test:e2e
      - name: Capture failure diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150
      - name: Remove only this job's disposable environment
        if: always()
        run: docker compose down --volumes --remove-orphans
