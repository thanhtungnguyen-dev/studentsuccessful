name: Job Collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: job-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.production.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.production.txt

      - name: Collect due jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIVE_COLLECTOR_CONCURRENCY: "16"
        run: python -m backend.app.commands.collect_live once --all
